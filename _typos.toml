[default]
# Translated text: AppStream elements with xml:lang and desktop Key[lang]= lines.
extend-ignore-re = [
    '<[a-z]+ xml:lang="[^"]+">.*',
    '(?m)^[A-Za-z-]+\[[A-Za-z_@]+\]=.*$',
]
extend-ignore-identifiers-re = [
    # GTK / libadwaita / Relm4 acronyms
    "Adw",
    "adw",
    # libmpv / FFmpeg domain words
    "mpv",
    "vaapi",
    "nvenc",
    "qsv",
    # MIME-class playlist formats
    "m3u",
    "pls",
    "cue",
    # MPRIS D-Bus
    "mpris",
]

[default.extend-words]
# Portuguese / locale tokens in user-facing strings + doc comments.
Controle = "Controle"
Progresso = "Progresso"
componentes = "componentes"
controles = "controles"
conver = "conver"
Converte = "Converte"
# Framework / crate / domain terms.
relm = "relm"
Relm = "Relm"
flate = "flate"
unparented = "unparented"   # GTK: widget removed from its parent.
seeked = "seeked"           # MPRIS spec "Seeked" D-Bus signal.
caf = "caf"                 # Percent-encoded "café" in tests.
ABD = "ABD"                 # Sort-order test input.

[files]
extend-exclude = [
    "target/**",
    "**/po/*.po",
    "**/po/*.pot",
    "crates/media-runtime/data/shaders/**",
    "build-locale/**",
    "*.mo",
    "*.svg",
    "Cargo.lock",
]
