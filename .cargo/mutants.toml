# cargo-mutants config (workspace root; read by `cargo mutants` for any member).
#
# Doctests run through `~/.agents/scripts/cargo-doctest.sh`, which forces an
# executable TMPDIR under `target/` on hardened hosts where `/tmp` is noexec.
# Keep mutation testing on nextest/unit targets so the baseline does not depend
# on raw rustdoc doctest temp binaries.
test_tool = "nextest"

# Mutation debt is tracked for production behavior. Helpers compiled only inside
# `#[cfg(test)] mod tests` are fixtures, not shipped logic, and mutating them
# creates false debt that does not represent application behavior.
exclude_re = [
    "tests::",
    # This function crosses the live GTK/Relm4 boundary. The display-free
    # options and runner delegation are covered in big-audio-converter tests;
    # the real UI launch belongs to the harness UI smoke path, not unit tests.
    'crates/big-audio-converter/src/lib\.rs:.*replace run_audio_converter_application -> std::process::ExitCode with Default::default\(\)',
    # The binary entrypoint delegates to the library contract above. Mutating
    # `main` itself only proves that unit tests do not launch the live GTK app.
    'crates/big-audio-converter/src/main\.rs:.*replace main -> std::process::ExitCode with Default::default\(\)',
    # Window construction needs a live GTK application/content widget. The
    # geometry/title contract is covered by AudioPlayerWindowSpec tests.
    'crates/big-audio-player/src/lib\.rs:.*replace build_player_window -> adw::ApplicationWindow with Default::default\(\)',
    # Embedded boot mutates process-global gettext, locale, resources, and app
    # accelerators. Rendered embed behavior belongs to UI smoke/host proof.
    'crates/big-audio-player/src/lib\.rs:.*replace embed_boot with \(\)',
    # Sending to the Relm4 thread-local broker is a live-shell boundary. The
    # empty/non-empty OpenPaths message contract is unit-tested separately.
    'crates/big-audio-player/src/lib\.rs:.*replace open_paths with \(\)',
    # GTK Application::open must activate the live app and send through the
    # shell broker. File-to-OpenPaths conversion is tested without rendering.
    'crates/big-audio-player/src/audio/app\.rs:.*replace imp::<impl ApplicationImpl for Application>::open with \(\)',
    # Startup mutates GTK process state, settings, actions, and accelerators.
    # The pure about/action/accelerator contracts are tested below the boundary.
    'crates/big-audio-player/src/audio/app\.rs:.*replace imp::<impl ApplicationImpl for Application>::startup with \(\)',
    # Action installation requires a live GApplication action map and About
    # dialog presentation. The about-dialog data contract is unit-tested.
    'crates/big-audio-player/src/audio/app\.rs:.*replace imp::Application::setup_actions with \(\)',
    # GTK accelerator installation mutates a live application. Resolved action
    # names and single-key filtering are unit-tested.
    'crates/big-audio-player/src/audio/app\.rs:.*replace install_audio_accels with \(\)',
    # Track column sorters are GTK object adapters over pure comparison
    # contracts (`compare_track_*_values`) tested in column_builders.
    'crates/big-audio-player/src/audio/column_builders\.rs:.*replace make_track_text_sorter -> gtk::CustomSorter with Default::default\(\)',
    'crates/big-audio-player/src/audio/column_builders\.rs:.*replace make_year_sorter -> gtk::CustomSorter with Default::default\(\)',
    'crates/big-audio-player/src/audio/column_builders\.rs:.*replace make_duration_sorter -> gtk::CustomSorter with Default::default\(\)',
    'crates/big-audio-player/src/audio/column_builders\.rs:.*replace make_rating_sorter -> gtk::CustomSorter with Default::default\(\)',
    # SignalListItemFactory setup/bind and live widget updates need GTK's
    # recycled-row machinery. Cell labels, star thresholds, and comparison
    # semantics are covered by display-free tests in column_builders.
    'crates/big-audio-player/src/audio/column_builders\.rs:.*replace make_year_factory -> gtk::SignalListItemFactory with Default::default\(\)',
    'crates/big-audio-player/src/audio/column_builders\.rs:.*replace update_star_icons with \(\)',
    'crates/big-audio-player/src/audio/column_builders\.rs:.*replace unbind_click_gestures with \(\)',
    'crates/big-audio-player/src/audio/column_builders\.rs:.*replace make_label_factory -> gtk::SignalListItemFactory with Default::default\(\)',
    'crates/big-audio-player/src/audio/column_builders\.rs:.*replace make_duration_factory -> gtk::SignalListItemFactory with Default::default\(\)',
]
