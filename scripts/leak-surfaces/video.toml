cycles = 6

[program]
command = ["target/debug/big-video-player"]
atspi_name = "big-video-player"

[program.env]
LANG = "C.UTF-8"
LC_ALL = "C.UTF-8"

[[allow]]
type = "AdwBreakpoint"
per_cycle = 3
reason = "libadwaita 1.9.3: AdwBreakpointBin does not release its breakpoints"

[[surface]]
name = "open-disc"
open = [{ do = "app-action", name = "win.open-disc" }]
close = [{ do = "dismiss" }]

[[surface]]
name = "open-url"
open = [{ do = "app-action", name = "win.open-url" }]
close = [{ do = "dismiss" }]

[[surface]]
name = "goto-time"
open = [{ do = "app-action", name = "win.goto-time" }]
close = [{ do = "dismiss" }]
