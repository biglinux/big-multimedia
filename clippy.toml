msrv = "1.98.1"

# ── Complexity thresholds ──────────────────────────────────────────
cognitive-complexity-threshold = 25
too-many-arguments-threshold = 8
type-complexity-threshold = 300
excessive-nesting-threshold = 10

# ── Naming / style thresholds ─────────────────────────────────────
single-char-binding-names-threshold = 5
enum-variant-name-threshold = 3
struct-field-name-threshold = 3

# ── Size thresholds ───────────────────────────────────────────────
trivial-copy-size-limit = 16
large-error-threshold = 256

# ── Dependency duplicates (cargo-deny covers this too) ────────────
allowed-duplicate-crates = []

disallowed-methods = [
    { path = "gio::Menu::append_section", reason = "GTK 4.22 PopoverMenu leaks unmerged section links; prefer flat menus until the native fix is packaged" },
    { path = "gtk4::prelude::AccessibleExtManual::update_relation", reason = "gtk-rs 0.11 leaks target GLists; use big_relm4_components::accessible::relate" },
    { path = "libadwaita::PasswordEntryRow::new", reason = "libadwaita 1.9 retains password buffers; use big_relm4_components::input::password_row::password_row" },
    { path = "libadwaita::builders::PasswordEntryRowBuilder::build", reason = "libadwaita 1.9 retains password buffers; use big_relm4_components::input::password_row::password_row" },
]

disallowed-types = [
    { path = "libadwaita::ViewStack", reason = "libadwaita 1.9 retains its transition animation; use gtk::Stack" },
]
