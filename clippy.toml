msrv = "1.98.1"

# ── Complexity thresholds ──────────────────────────────────────────
cognitive-complexity-threshold = 25
too-many-arguments-threshold = 8
type-complexity-threshold = 300
excessive-nesting-threshold = 10

# ── Naming / style thresholds ─────────────────────────────────────
single-char-binding-names-threshold = 5
enum-variant-name-threshold = 3
struct-field-name-threshold = 3

# ── Size thresholds ───────────────────────────────────────────────
trivial-copy-size-limit = 16
large-error-threshold = 256

# ── Dependency duplicates (cargo-deny covers this too) ────────────
allowed-duplicate-crates = []

disallowed-methods = [
    # >>> big-gtk-kit bans, written from the kit revision Cargo.lock pins
    { path = "libadwaita::AlertDialog::new", reason = "every dialog leaves three breakpoints behind when it goes (libadwaita 1.9, about 1.8 KB an opening); use `big_gtk_kit::alert::Alert::new`, which asks again with one already made" },
    { path = "libadwaita::AlertDialog::builder", reason = "every dialog leaves three breakpoints behind when it goes (libadwaita 1.9, about 1.8 KB an opening); use `big_gtk_kit::alert::Alert::builder`" },
    { path = "libadwaita::Dialog::new", reason = "every dialog leaves three breakpoints behind when it goes (libadwaita 1.9, about 1.8 KB an opening); use `big_gtk_kit::dialog::Dialog::new`, which shows one already made" },
    { path = "libadwaita::Dialog::builder", reason = "every dialog leaves three breakpoints behind when it goes (libadwaita 1.9, about 1.8 KB an opening); use `big_gtk_kit::dialog::Dialog::builder`" },
    # <<< big-gtk-kit bans
    { path = "glib::SourceId::remove", reason = "panics when the source already ran, which aborts inside a GLib callback; use `big_gtk_kit::source::remove`" },
    # From big-gtk-kit/clippy.toml.
    { path = "gtk4::prelude::AccessibleExtManual::update_relation", reason = "leaks the list of targets on every call (gtk-rs 0.11); use `big_gtk_kit::accessible::relate`" },
    { path = "libadwaita::PasswordEntryRow::new", reason = "leaks its buffer and the password in it (libadwaita 1.9); use `big_gtk_kit::password::password_row(adw::PasswordEntryRow::builder())`" },
    { path = "libadwaita::builders::PasswordEntryRowBuilder::build", reason = "leaks its buffer and the password in it (libadwaita 1.9); pass the builder to `big_gtk_kit::password::password_row`, then name the row with `big_relm4_components::input::entry_row::name_by_title`" },
    { path = "libadwaita::EntryRow::new", reason = "a screen reader reads its title twice (libadwaita 1.9); use `big_relm4_components::input::entry_row::build(adw::EntryRow::builder())`" },
    { path = "libadwaita::builders::EntryRowBuilder::build", reason = "a screen reader reads its title twice (libadwaita 1.9); pass the builder to `big_relm4_components::input::entry_row::build`" },
    { path = "libadwaita::prelude::AlertDialogExtManual::choose", reason = "leaks the dialog (libadwaita-rs 0.9); use `big_gtk_kit::alert::choose`" },
    { path = "libadwaita::prelude::AlertDialogExtManual::choose_future", reason = "leaks the dialog (libadwaita-rs 0.9); use `big_gtk_kit::alert::choose_future`" },
    { path = "libadwaita::prelude::MessageDialogExtManual::choose", reason = "leaks the dialog (libadwaita-rs 0.9); use `adw::AlertDialog` with `big_gtk_kit::alert::choose`" },
    { path = "libadwaita::prelude::AdwWindowExt::add_breakpoint", reason = "the breakpoint outlives the window (libadwaita 1.9); use `big_gtk_kit::breakpoint::add`" },
    { path = "libadwaita::prelude::AdwApplicationWindowExt::add_breakpoint", reason = "the breakpoint outlives the window (libadwaita 1.9); use `big_gtk_kit::breakpoint::add`" },
    { path = "libadwaita::prelude::AdwDialogExt::add_breakpoint", reason = "the breakpoint outlives the dialog (libadwaita 1.9); use `big_gtk_kit::breakpoint::add`" },
    { path = "libadwaita::prelude::BreakpointBinExt::add_breakpoint", reason = "the breakpoint outlives the bin (libadwaita 1.9); use `big_gtk_kit::breakpoint::add`" },
    { path = "gtk4::Switch::set_active", reason = "cancels a click's slide even when the value is unchanged (GTK 4.22), so a refresh swallows the click; use `big_gtk_kit::switch::set_active`" },
    { path = "libc::dlopen", reason = "use `player::mpv_backend::gl_proc_address::library_symbol`, or its `gl_function`, `egl_function` and `library_function` (crates/media-runtime/src/player/mpv_backend/gl_proc_address.rs), which resolve GL through eglGetProcAddress for Mesa and NVIDIA under libglvnd and open each system library once" },
    { path = "libc::dlsym", reason = "use `player::mpv_backend::gl_proc_address::library_symbol`, or its `gl_function`, `egl_function` and `library_function` (crates/media-runtime/src/player/mpv_backend/gl_proc_address.rs), which resolve GL through eglGetProcAddress for Mesa and NVIDIA under libglvnd and open each system library once" },
    { path = "std::os::unix::fs::OpenOptionsExt::custom_flags", reason = "use `big_os_kit::storage::open_regular_read` (crates/foundation/big-os-kit/src/storage/transaction.rs), which refuses a final symlink, a FIFO and anything not a regular file" },
    { path = "libc::poll", reason = "use `big_os_kit::poll::poll` (crates/foundation/big-os-kit/src/poll.rs), which borrows the descriptors for the wait and treats an interruption as a wake" },
    { path = "libc::renameat2", reason = "use `big_os_kit::storage::rename_no_replace` (crates/foundation/big-os-kit/src/storage/transaction.rs); where it fails with EINVAL the filesystem cannot refuse a replacing rename, so fall back to `StagedFile::publish`, never check-then-rename" },
    { path = "big_app_kit::desktop::BigSystemPowerAction::spawn_detached", reason = "settings writes must finish before suspend or power off; use the sleep timer in crates/media-runtime/src/sleep_timer.rs" },
    { path = "glib::home_dir", reason = "use `big_os_kit::xdg_dirs::home_dir` (crates/foundation/big-os-kit/src/xdg_dirs.rs), which returns `None` instead of a relative or guessed path" },
    { path = "std::env::home_dir", reason = "use `big_os_kit::xdg_dirs::home_dir` (crates/foundation/big-os-kit/src/xdg_dirs.rs), which returns `None` instead of a relative or guessed path" },
    { path = "glib::user_special_dir", reason = "use `big_os_kit::xdg_dirs::user_dir` (crates/foundation/big-os-kit/src/xdg_dirs.rs), which reads `user-dirs.dirs` with the same rules as the base directories" },
    { path = "glib::user_cache_dir", reason = "use `big_os_kit::xdg_dirs::cache_dir` (crates/foundation/big-os-kit/src/xdg_dirs.rs), which ignores a relative `XDG_CACHE_HOME` and returns `None` instead of guessing a path" },
    { path = "glib::user_data_dir", reason = "use `big_os_kit::xdg_dirs::data_dir` (crates/foundation/big-os-kit/src/xdg_dirs.rs), which ignores a relative `XDG_DATA_HOME` and returns `None` instead of guessing a path" },
    { path = "glib::user_config_dir", reason = "use `big_os_kit::xdg_dirs::config_dir` (crates/foundation/big-os-kit/src/xdg_dirs.rs), which ignores a relative `XDG_CONFIG_HOME` and returns `None` instead of guessing a path" },
    { path = "gtk4::style_context_add_provider_for_display", reason = "the display keeps the provider after its widget goes; use `big_relm4_components::theme::CssSlot` (crates/ui/generic/big-relm4-components/src/theme.rs) for CSS replaced in place, or `big_gtk_kit::css::add_provider_for_widget_lifetime` for a fixed sheet" },
    { path = "gtk4::style_context_remove_provider_for_display", reason = "removal belongs to the registration's widget; use `big_relm4_components::theme::CssSlot` (crates/ui/generic/big-relm4-components/src/theme.rs), which leaves the display with its widget" },
    { path = "big_media_components::preference_rows::switch_row", reason = "a preference row reads and writes its setting through one typed key; use `big_player_ui::preference_rows::add_switch_row` (crates/ui/media/big-player-ui/src/preference_rows.rs)" },
    { path = "big_media_components::preference_rows::combo_row", reason = "a preference row reads and writes its setting through one typed key; use `big_player_ui::preference_rows::add_combo_row` or `add_index_combo_row` (crates/ui/media/big-player-ui/src/preference_rows.rs)" },
    { path = "big_media_components::preference_rows::spin_int_row", reason = "a preference row reads and writes its setting through one typed key; use `big_player_ui::preference_rows::add_spin_int_row` (crates/ui/media/big-player-ui/src/preference_rows.rs)" },
    { path = "big_media_components::preference_rows::spin_double_row", reason = "a preference row reads and writes its setting through one typed key; use `big_player_ui::preference_rows::add_spin_double_row` (crates/ui/media/big-player-ui/src/preference_rows.rs)" },
    { path = "big_media_components::preference_rows::entry_row", reason = "a preference row reads and writes its setting through one typed key; use `big_player_ui::preference_rows::add_entry_row` (crates/ui/media/big-player-ui/src/preference_rows.rs)" },
    { path = "big_media_components::preference_rows::mpv_color_row", reason = "a preference row reads and writes its setting through one typed key; use `big_player_ui::preference_rows::add_mpv_color_row` (crates/ui/media/big-player-ui/src/preference_rows.rs)" },
    { path = "gio::prelude::FileExt::trash", reason = "use `big_media_runtime::media::playlist::trash_file` (crates/media-runtime/src/media/playlist_scan/trash.rs), whose `restore_from_trash` undoes it" },
    { path = "gio::prelude::FileExt::trash_async", reason = "use `big_media_runtime::media::playlist::trash_file` (crates/media-runtime/src/media/playlist_scan/trash.rs) off the main loop, whose `restore_from_trash` undoes it" },
    { path = "gio::prelude::FileExt::trash_future", reason = "use `big_media_runtime::media::playlist::trash_file` (crates/media-runtime/src/media/playlist_scan/trash.rs) off the main loop, whose `restore_from_trash` undoes it" },
    { path = "gtk4::FileDialog::builder", reason = "use `big_app_kit::file_dialogs::FilePicker` (crates/app/big-app-kit/src/file_dialogs.rs)" },
    { path = "gtk4::FileDialog::new", reason = "use `big_app_kit::file_dialogs::FilePicker` (crates/app/big-app-kit/src/file_dialogs.rs)" },
    { path = "gio::Menu::append_section", reason = "GTK 4.22's menu tracker keeps every section it shows; use `big_gtk_kit::menu::append_shared_section`" },
    { path = "gtk4::PopoverMenu::from_model", reason = "GTK 4.24 leaves its items unnamed for screen readers; use `popover_menu::from_model` (crates/ui/generic/big-relm4-components/src/feedback/popover_menu.rs)" },
    { path = "gtk4::PopoverMenu::from_model_full", reason = "GTK 4.24 leaves its items unnamed for screen readers; use `popover_menu::from_model` (crates/ui/generic/big-relm4-components/src/feedback/popover_menu.rs)" },
    { path = "gtk4::PopoverMenu::builder", reason = "GTK 4.24 leaves its items unnamed for screen readers; use `popover_menu::from_model` (crates/ui/generic/big-relm4-components/src/feedback/popover_menu.rs)" },
    { path = "gtk4::MenuButton::set_menu_model", reason = "GTK 4.24 leaves its items unnamed for screen readers; use `popover_menu::set_menu_model` (crates/ui/generic/big-relm4-components/src/feedback/popover_menu.rs)" },
    { path = "libadwaita::SpinRow::builder", reason = "libadwaita 1.10 hides the row and its spin button from screen readers under GTK 4.24; use `spin_row::accessible_spin_row` (crates/ui/generic/big-relm4-components/src/input/spin_row.rs)" },
    { path = "libadwaita::SpinRow::new", reason = "libadwaita 1.10 hides the row and its spin button from screen readers under GTK 4.24; use `spin_row::accessible_spin_row` (crates/ui/generic/big-relm4-components/src/input/spin_row.rs)" },
    { path = "libadwaita::SpinRow::with_range", reason = "libadwaita 1.10 hides the row and its spin button from screen readers under GTK 4.24; use `spin_row::accessible_spin_row` (crates/ui/generic/big-relm4-components/src/input/spin_row.rs)" },
    { path = "gtk4::SpinButton::builder", reason = "a spin button needs a resolved range and an accessible name; use `spin_row::accessible_spin_button` (crates/ui/generic/big-relm4-components/src/input/spin_row.rs)" },
    { path = "gtk4::SpinButton::new", reason = "a spin button needs a resolved range and an accessible name; use `spin_row::accessible_spin_button` (crates/ui/generic/big-relm4-components/src/input/spin_row.rs)" },
    { path = "gtk4::SpinButton::with_range", reason = "a spin button needs a resolved range and an accessible name; use `spin_row::accessible_spin_button` (crates/ui/generic/big-relm4-components/src/input/spin_row.rs)" },
    { path = "gtk4::builders::MenuButtonBuilder::menu_model", reason = "GTK 4.24 leaves its items unnamed for screen readers; use `popover_menu::set_menu_model` (crates/ui/generic/big-relm4-components/src/feedback/popover_menu.rs)" },
]

disallowed-types = [
    # From big-gtk-kit/clippy.toml.
    { path = "libadwaita::InlineViewSwitcher", reason = "leaks a widget tree per page (libadwaita 1.9); use `big_gtk_kit::view_switcher::toggles_for` over a `gtk::Stack`" },
    { path = "libadwaita::ViewStack", reason = "leaks its transition animation (libadwaita 1.9); use `gtk::Stack` with `big_gtk_kit::view_switcher::toggles_for`" },
    { path = "libadwaita::ViewSwitcher", reason = "needs an `AdwViewStack`, which leaks (libadwaita 1.9); use `big_gtk_kit::view_switcher::toggles_for` over a `gtk::Stack`" },
]
