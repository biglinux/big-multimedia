msrv = "1.98.1"

# ── Complexity thresholds ──────────────────────────────────────────
cognitive-complexity-threshold = 25
too-many-arguments-threshold = 8
type-complexity-threshold = 300
excessive-nesting-threshold = 10

# ── Naming / style thresholds ─────────────────────────────────────
single-char-binding-names-threshold = 5
enum-variant-name-threshold = 3
struct-field-name-threshold = 3

# ── Size thresholds ───────────────────────────────────────────────
trivial-copy-size-limit = 16
large-error-threshold = 256

# ── Dependency duplicates (cargo-deny covers this too) ────────────
allowed-duplicate-crates = []

disallowed-methods = [
    # From big-gtk-kit/clippy.toml.
    { path = "gtk4::prelude::AccessibleExtManual::update_relation", reason = "leaks the list of targets on every call (gtk-rs 0.11); use `big_gtk_kit::accessible::relate`" },
    { path = "libadwaita::PasswordEntryRow::new", reason = "leaks its buffer and the password in it (libadwaita 1.9); use `big_gtk_kit::password::password_row(adw::PasswordEntryRow::builder())`" },
    { path = "libadwaita::builders::PasswordEntryRowBuilder::build", reason = "leaks its buffer and the password in it (libadwaita 1.9); pass the builder to `big_gtk_kit::password::password_row`" },
    { path = "libadwaita::prelude::AlertDialogExtManual::choose", reason = "leaks the dialog (libadwaita-rs 0.9); use `big_gtk_kit::alert::choose`" },
    { path = "libadwaita::prelude::AlertDialogExtManual::choose_future", reason = "leaks the dialog (libadwaita-rs 0.9); use `big_gtk_kit::alert::choose_future`" },
    { path = "libadwaita::prelude::MessageDialogExtManual::choose", reason = "leaks the dialog (libadwaita-rs 0.9); use `adw::AlertDialog` with `big_gtk_kit::alert::choose`" },
    { path = "libadwaita::prelude::AdwWindowExt::add_breakpoint", reason = "the breakpoint outlives the window (libadwaita 1.9); use `big_gtk_kit::breakpoint::add`" },
    { path = "libadwaita::prelude::AdwApplicationWindowExt::add_breakpoint", reason = "the breakpoint outlives the window (libadwaita 1.9); use `big_gtk_kit::breakpoint::add`" },
    { path = "libadwaita::prelude::AdwDialogExt::add_breakpoint", reason = "the breakpoint outlives the dialog (libadwaita 1.9); use `big_gtk_kit::breakpoint::add`" },
    { path = "libadwaita::prelude::BreakpointBinExt::add_breakpoint", reason = "the breakpoint outlives the bin (libadwaita 1.9); use `big_gtk_kit::breakpoint::add`" },
    { path = "gtk4::Switch::set_active", reason = "cancels a click's slide even when the value is unchanged (GTK 4.22), so a refresh swallows the click; use `big_gtk_kit::switch::set_active`" },
    { path = "gio::Menu::append_section", reason = "GTK 4.22's menu tracker keeps every section it shows; use `big_gtk_kit::menu::append_shared_section`" },
]

disallowed-types = [
    # From big-gtk-kit/clippy.toml.
    { path = "libadwaita::InlineViewSwitcher", reason = "leaks a widget tree per page (libadwaita 1.9); use `big_gtk_kit::view_switcher::toggles_for` over a `gtk::Stack`" },
    { path = "libadwaita::ViewStack", reason = "leaks its transition animation (libadwaita 1.9); use `gtk::Stack` with `big_gtk_kit::view_switcher::toggles_for`" },
    { path = "libadwaita::ViewSwitcher", reason = "needs an `AdwViewStack`, which leaks (libadwaita 1.9); use `big_gtk_kit::view_switcher::toggles_for` over a `gtk::Stack`" },
]
