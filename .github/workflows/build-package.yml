name: Build Package

on:
  push:
    branches: [main, "testing-*", "stable-*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Send Hooks BigLinux Build Package
        shell: bash
        env:
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          payload=$(jq -n --arg repository "$REPOSITORY" --arg branch "$BRANCH" \
            '{event_type: $repository, client_payload: {branch: $branch, url: "https://github.com/\($repository)"}}')
          curl --fail-with-body -X POST -H "Accept: application/json" -H "Authorization: token $WEBHOOK_TOKEN" \
            --data "$payload" https://api.github.com/repos/BigLinux-Package-Build/build-package/dispatches
