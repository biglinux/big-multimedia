[package]
name = "big-media-runtime"
publish = false
version = "2.0.0"
edition.workspace = true
authors = ["BigLinux Team"]
license = "GPL-3.0-or-later"
description = "Shared runtime for BigLinux multimedia applications"
homepage = "https://github.com/biglinux/big-multimedia"
repository = "https://github.com/biglinux/big-multimedia"
rust-version.workspace = true
autobins = false

[lib]
name = "big_media_runtime"
path = "src/lib.rs"

[[test]]
name = "sql_injection"
required-features = ["ui"]

[[test]]
name = "ui_labels_pot_roundtrip"
required-features = ["ui"]

# Property test over the ui-only filter builder; also `#![cfg(feature = "fuzz")]`.
# Needs both features or `cargo test --features fuzz` fails to compile it.
[[test]]
name = "filter_chain_props"
required-features = ["ui", "fuzz"]

# Uses adw/gtk directly; skip it unless the ui feature pulls those in.
[[example]]
name = "ui_surface_probe"
required-features = ["ui"]

[dependencies]
adw = { version = "0.9", features = ["v1_9"], package = "libadwaita", optional = true }
gtk = { version = "0.11", features = ["v4_22"], package = "gtk4", optional = true }
glib = { version = "0.22", optional = true }
gio = { version = "0.22", optional = true }
gdk = { version = "0.11", package = "gdk4", optional = true }
gdk-wayland-sys = { version = "0.11", package = "gdk4-wayland-sys", optional = true }
# Direct (was already transitive via big-relm4-components): the relocated editor
# Components (VideoEditor/AudioEditor) use relm4 directly. Same pinned 0.11.
relm4 = { version = "0.11.0", features = ["libadwaita"], optional = true }
mpv-sys = { version = "4", package = "libmpv2-sys", optional = true }
libc = "0.2"
big-audio-effects = { path = "../foundation/big-audio-effects" }
big-app-kit = { path = "../app/big-app-kit", features = ["http-client", "remote-control"], optional = true }
big-os-kit = { path = "../foundation/big-os-kit" }
big-media-engines = { path = "../foundation/big-media-engines" }
big-relm4-components = { path = "../ui/generic/big-relm4-components", optional = true }
big-media-components = { path = "../ui/media/big-media-components", optional = true }
big-mpv-render = { path = "../foundation/big-mpv-render", optional = true }
# GTK-free data services (SQLite library, settings store, radio/library clients)
# extracted from this crate; re-exported under the legacy module paths.
big-media-data = { path = "../foundation/big-media-data", default-features = false }

gettext-rs = { version = "0.7", features = ["gettext-system"] }

# Retained after the big-media-data extraction (still used runtime-side:
# rusqlite by remaining queries, md-5 for cache keys).
rusqlite = { version = "0.40.1", default-features = false, optional = true }
md-5 = { version = "0.11", optional = true }

log = "0.4"
env_logger = "0.11"
async-channel = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Chromecast / Cast support
rust_cast = { version = "0.21", features = ["thread_safe"], optional = true }

# Owned 0700 scratch dirs for cast transcode (defeats /tmp symlink races).
tempfile = "3"

[features]
# Keep the runtime's default footprint GTK/mpv-free. Apps that mount player or
# editor UI request `audio` or `video`; daemon/data consumers stay lean.
#
# Gates are purely additive: no `cfg(not(...))`, and no item defined twice under
# exclusive gates, so `--all-features` stays buildable.
default = []

# The GTK/relm4/mpv stack plus the modules both players need. Not selected
# directly by an app; `audio` and `video` pull it in.
ui-core = [
    "dep:adw",
    "dep:gtk",
    "dep:glib",
    "dep:gio",
    "dep:gdk",
    "dep:relm4",
    "dep:mpv-sys",
    "dep:big-app-kit",
    "dep:big-relm4-components",
    "dep:big-media-components",
    "dep:md-5",
]
# Audio player: the SQLite music library, radio directory and podcast data.
audio = [
    "ui-core",
    "big-media-data/db",
    "big-media-data/library",
    "big-media-data/radio",
    "dep:rusqlite",
]
# Video player: the mpv render pipeline (GL surface, DMA-BUF offload, shaders).
video = [
    "ui-core",
    "dep:big-mpv-render",
    "dep:gdk-wayland-sys",
]
# Union kept so any consumer still asking for `ui` keeps building.
ui = ["audio", "video"]
# Rebased on `ui-core` on purpose: the video PKGBUILD builds with
# `--features chromecast`, and implying `ui` there would undo the split for the
# binary that actually ships.
chromecast = [
    "ui-core",
    "dep:rust_cast",
]
# Gates slow property tests so default `cargo test` stays fast. CI runs
# `cargo test --features fuzz` on a dedicated job.
fuzz = []

[dev-dependencies]
tempfile = "3"
proptest = "1"

[package.metadata.cargo-machete]
ignored = ["gettext-rs", "md-5"]  # gettext-rs imported as gettextrs; md-5 imported as md5

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Suppress noisy pedantic lints for GTK projects
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
# Documentation lints — too noisy for internal project
doc_markdown = "allow"
# GTK projects use wildcard imports extensively
wildcard_imports = "allow"
# Common in crypto/hash implementations and GTK signal handlers
similar_names = "allow"
many_single_char_names = "allow"
# Items after statements common in GTK setup code
items_after_statements = "allow"
# Style lints
option_if_let_else = "allow"
needless_pass_by_value = "allow"
# Manual refactoring needed — tracked but not blocking
format_push_string = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
clone_on_ref_ptr = "allow"
ref_option = "allow"

# ── Important for FFI/unsafe-heavy code ───────────────────────────
not_unsafe_ptr_arg_deref = "deny"
ptr_as_ptr = "warn"

# ── Restriction lints (opt-in, high value) ────────────────────────
dbg_macro = "warn"
todo = "warn"
rc_buffer = "warn"                  # Rc<Vec<T>> / Rc<String> — usually wrong
rc_mutex = "warn"                   # Rc<Mutex<T>> — usually want Arc
verbose_file_reads = "warn"         # prefer fs::read_to_string
unseparated_literal_suffix = "warn" # 1i64 → 1_i64

# ── Allowed after review ──────────────────────────────────────────
# Float comparisons — all are intentional exact checks on preset values
float_cmp = "allow"
# Minor style — Debug formatting in eprintln for paths (intentional)
use_debug = "allow"
unnecessary_debug_formatting = "allow"
# Minor — large stack array in chromecast read buffer (intentional)
large_stack_arrays = "allow"
# Minor API suggestions
implicit_hasher = "allow"
missing_fields_in_debug = "allow"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"
unused_mut = "warn"
unreachable_code = "warn"
unreachable_patterns = "warn"
trivial_numeric_casts = "warn"
