[package]
name = "big-media-runtime"
publish = false
version = "2.0.0"
edition.workspace = true
authors = ["BigLinux Team"]
license = "GPL-3.0-or-later"
description = "Shared runtime for BigLinux multimedia applications"
homepage = "https://github.com/biglinux/big-multimedia"
repository = "https://github.com/biglinux/big-multimedia"
rust-version.workspace = true
autobins = false

[lib]
name = "big_media_runtime"
path = "src/lib.rs"

[[test]]
name = "sql_injection"
required-features = ["ui"]

# Property test over the ui-only filter builder; also `#![cfg(feature = "fuzz")]`.
# Needs both features or `cargo test --features fuzz` fails to compile it.
[[test]]
name = "filter_chain_props"
required-features = ["ui", "fuzz"]

[dependencies]
adw = { workspace = true, optional = true }
gtk = { workspace = true, optional = true }
glib = { workspace = true, optional = true }
gio = { workspace = true, optional = true }
gdk = { version = "0.11", package = "gdk4", optional = true }
gdk-wayland-sys = { version = "0.11", package = "gdk4-wayland-sys", optional = true }
mpv-sys = { version = "4", package = "libmpv2-sys", optional = true }
libc.workspace = true
big-audio-effects.workspace = true
big-app-kit = { workspace = true, features = ["remote-control"], optional = true }
big-os-kit.workspace = true
big-gtk-kit = { workspace = true, optional = true }
big-relm4-components = { workspace = true, optional = true }
big-media-components = { workspace = true, optional = true }
big-mpv-render = { workspace = true, optional = true }
# GTK-free data services (SQLite library, settings store, radio/library clients),
# re-exported from `lib.rs` as `db`, `library`, `settings`, `config`, `i18n`.
big-media-data.workspace = true

gettext-rs.workspace = true

rusqlite = { version = "0.40.1", default-features = false, optional = true }

log.workspace = true
env_logger = "0.11"
async-channel = "2.5"
serde.workspace = true
serde_json.workspace = true
toml = "1"


[features]
# Keep the runtime's default footprint GTK/mpv-free. Apps that mount player
# UI request `audio` or `video`; daemon/data consumers stay lean.
#
# Gates are purely additive: no `cfg(not(...))`, and no item defined twice under
# exclusive gates, so `--all-features` stays buildable.
default = []

# The GTK/relm4/mpv stack plus the modules both players need. Not selected
# directly by an app; `audio` and `video` pull it in.
ui-core = [
    "dep:adw",
    "dep:gtk",
    "dep:glib",
    "dep:gio",
    "dep:gdk",
    "dep:mpv-sys",
    "dep:big-app-kit",
    "dep:big-gtk-kit",
    "dep:big-relm4-components",
    "dep:big-media-components",
]
# Audio player: the SQLite music library, radio directory and podcast data.
audio = [
    "ui-core",
    "big-media-data/db",
    "big-media-data/library",
    "big-media-data/radio",
    "dep:rusqlite",
]
# Video player: the mpv render pipeline (GL surface, DMA-BUF offload, shaders).
video = [
    "ui-core",
    "dep:big-mpv-render",
    "dep:gdk-wayland-sys",
]
# Both player feature sets; the integration tests in `tests/` require it.
ui = ["audio", "video"]
# Gates slow property tests so default `cargo test` stays fast. CI runs
# `cargo test --features fuzz` on a dedicated job.
fuzz = []

[dev-dependencies]
proptest = "1"
tempfile = "3"

[package.metadata.cargo-machete]
ignored = ["gettext-rs"]  # imported as gettextrs

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Sample, pixel and time arithmetic converts between widths on purpose.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
doc_markdown = "allow"
wildcard_imports = "allow"
similar_names = "allow"
many_single_char_names = "allow"
# GTK setup code declares helpers next to the widgets they serve.
items_after_statements = "allow"
option_if_let_else = "allow"
needless_pass_by_value = "allow"
format_push_string = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
clone_on_ref_ptr = "allow"
ref_option = "allow"
# Float equality compares stored preset values exactly.
float_cmp = "allow"
use_debug = "allow"
unnecessary_debug_formatting = "allow"
implicit_hasher = "allow"
missing_fields_in_debug = "allow"

# FFI and unsafe code.
not_unsafe_ptr_arg_deref = "deny"
ptr_as_ptr = "warn"

# Restriction lints.
dbg_macro = "warn"
todo = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
verbose_file_reads = "warn"
unseparated_literal_suffix = "warn"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"
unused_mut = "warn"
unreachable_code = "warn"
unreachable_patterns = "warn"
trivial_numeric_casts = "warn"
