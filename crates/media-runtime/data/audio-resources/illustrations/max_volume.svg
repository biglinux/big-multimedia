<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <!-- Volume slider track -->
  <rect x="15" y="36" width="90" height="8" rx="4" fill="#e0e0e0"/>
  <!-- Filled portion (up to 150%) -->
  <rect x="15" y="36" width="67" height="8" rx="4" fill="#3584e4"/>
  <!-- Extended zone (100%-200%) -->
  <rect x="69" y="36" width="14" height="8" rx="0" fill="#e5a50a" opacity="0.7"/>
  <!-- Slider handle -->
  <circle cx="83" cy="40" r="8" fill="#fff" stroke="#e5a50a" stroke-width="2"/>
  <!-- 100% mark -->
  <line x1="69" y1="30" x2="69" y2="50" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="69" y="26" font-family="sans-serif" font-size="8" fill="#999" text-anchor="middle">100%</text>
  <!-- 200% mark -->
  <text x="105" y="26" font-family="sans-serif" font-size="8" fill="#999" text-anchor="middle">200%</text>
  <!-- 150% current -->
  <text x="83" y="62" font-family="sans-serif" font-size="9" fill="#e5a50a" text-anchor="middle" font-weight="bold">150%</text>
</svg>
