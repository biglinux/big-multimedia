<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <!-- First wave fading out -->
  <g opacity="1">
    <line x1="10" y1="40" x2="18" y2="30" stroke="#3584e4" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="30" x2="26" y2="45" stroke="#3584e4" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="26" y1="45" x2="34" y2="32" stroke="#3584e4" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g opacity="0.6">
    <line x1="34" y1="32" x2="42" y2="42" stroke="#3584e4" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="42" y1="42" x2="50" y2="36" stroke="#3584e4" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g opacity="0.25">
    <line x1="50" y1="36" x2="58" y2="39" stroke="#3584e4" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="58" y1="39" x2="66" y2="38" stroke="#3584e4" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Second wave fading in -->
  <g opacity="0.25">
    <line x1="54" y1="42" x2="62" y2="38" stroke="#e5a50a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="62" y1="38" x2="70" y2="41" stroke="#e5a50a" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g opacity="0.6">
    <line x1="70" y1="41" x2="78" y2="35" stroke="#e5a50a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="78" y1="35" x2="86" y2="46" stroke="#e5a50a" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g opacity="1">
    <line x1="86" y1="46" x2="94" y2="30" stroke="#e5a50a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="94" y1="30" x2="102" y2="44" stroke="#e5a50a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="102" y1="44" x2="110" y2="34" stroke="#e5a50a" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Overlap zone indicator -->
  <rect x="50" y="56" width="20" height="3" rx="1.5" fill="#3584e4" opacity="0.5"/>
  <rect x="50" y="56" width="20" height="3" rx="1.5" fill="#e5a50a" opacity="0.3"/>
</svg>
