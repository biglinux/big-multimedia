<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <!-- First waveform block -->
  <g transform="translate(8,15)">
    <rect x="0" y="0" width="40" height="50" rx="4" fill="#e0e0e0" stroke="#bbb" stroke-width="1"/>
    <line x1="10" y1="25" x2="15" y2="15" stroke="#3584e4" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="15" x2="20" y2="35" stroke="#3584e4" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="35" x2="25" y2="20" stroke="#3584e4" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="20" x2="30" y2="30" stroke="#3584e4" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- No gap indicator -->
  <rect x="48" y="30" width="24" height="20" rx="3" fill="#3584e4" opacity="0.15"/>
  <text x="60" y="44" font-family="sans-serif" font-size="10" fill="#3584e4" text-anchor="middle" font-weight="bold">0s</text>
  <!-- Second waveform block -->
  <g transform="translate(72,15)">
    <rect x="0" y="0" width="40" height="50" rx="4" fill="#e0e0e0" stroke="#bbb" stroke-width="1"/>
    <line x1="10" y1="30" x2="15" y2="20" stroke="#e5a50a" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="20" x2="20" y2="35" stroke="#e5a50a" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="35" x2="25" y2="15" stroke="#e5a50a" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="15" x2="30" y2="28" stroke="#e5a50a" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
