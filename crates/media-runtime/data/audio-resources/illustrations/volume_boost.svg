<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <!-- Knob circle -->
  <circle cx="60" cy="40" r="24" fill="none" stroke="#3584e4" stroke-width="2.5"/>
  <!-- Knob pointer -->
  <line x1="60" y1="40" x2="60" y2="20" stroke="#3584e4" stroke-width="3" stroke-linecap="round"/>
  <!-- Minus label -->
  <text x="20" y="44" font-family="sans-serif" font-size="16" font-weight="bold" fill="#999" text-anchor="middle">−</text>
  <!-- Plus label -->
  <text x="100" y="44" font-family="sans-serif" font-size="16" font-weight="bold" fill="#999" text-anchor="middle">+</text>
  <!-- dB arc markers -->
  <path d="M 38,55 A 24 24 0 0 1 38,25" fill="none" stroke="#ddd" stroke-width="1.5"/>
  <path d="M 82,25 A 24 24 0 0 1 82,55" fill="none" stroke="#ddd" stroke-width="1.5"/>
</svg>
