<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <!-- Play button with bookmark -->
  <circle cx="45" cy="40" r="20" fill="none" stroke="#3584e4" stroke-width="2"/>
  <polygon points="39,28 39,52 58,40" fill="#3584e4"/>
  <!-- Rewind arrow / resume indicator -->
  <path d="M 75,25 C 90,25 95,40 85,48" fill="none" stroke="#e5a50a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 83,43 L 85,48 L 90,45" fill="none" stroke="#e5a50a" stroke-width="2" stroke-linecap="round"/>
  <!-- Time stamp -->
  <text x="82" y="62" font-family="sans-serif" font-size="11" fill="#999" text-anchor="middle">2:47</text>
</svg>
