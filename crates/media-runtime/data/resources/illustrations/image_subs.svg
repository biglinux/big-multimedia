<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <!-- Bitmap subtitle (pixelated) being smoothed -->
  <!-- DVD icon -->
  <circle cx="30" cy="34" r="18" fill="none" stroke="#999" stroke-width="1.5"/>
  <circle cx="30" cy="34" r="6" fill="none" stroke="#999" stroke-width="1"/>
  <circle cx="30" cy="34" r="2" fill="#999"/>
  <text x="30" y="60" font-family="sans-serif" font-size="7" fill="#999" text-anchor="middle">DVD</text>
  <!-- Arrow -->
  <path d="M54,34 L66,34" stroke="#3584e4" stroke-width="2" fill="none" marker-end="url(#barr)"/>
  <defs><marker id="barr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3584e4"/></marker></defs>
  <!-- Smoothed bitmap subtitle -->
  <rect x="72" y="24" width="36" height="16" rx="3" fill="#3584e4" opacity="0.1"/>
  <text x="90" y="35" font-family="sans-serif" font-size="8" fill="#3584e4" text-anchor="middle">Abc</text>
  <text x="90" y="60" font-family="sans-serif" font-size="7" fill="#3584e4" text-anchor="middle">smooth</text>
</svg>
