<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <!-- Button size: button with dimension arrows -->
  <!-- Button shape -->
  <rect x="35" y="18" width="50" height="30" rx="8" fill="#3584e4" opacity="0.2" stroke="#3584e4" stroke-width="1.5"/>
  <!-- Play icon inside -->
  <polygon points="54,27 54,41 66,34" fill="#3584e4" opacity="0.6"/>
  <!-- Width arrow -->
  <line x1="35" y1="58" x2="85" y2="58" stroke="#f5c211" stroke-width="1.5"/>
  <polyline points="37,55 35,58 37,61" fill="none" stroke="#f5c211" stroke-width="1.5" stroke-linecap="round"/>
  <polyline points="83,55 85,58 83,61" fill="none" stroke="#f5c211" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Height arrow -->
  <line x1="96" y1="18" x2="96" y2="48" stroke="#f5c211" stroke-width="1.5"/>
  <polyline points="93,20 96,18 99,20" fill="none" stroke="#f5c211" stroke-width="1.5" stroke-linecap="round"/>
  <polyline points="93,46 96,48 99,46" fill="none" stroke="#f5c211" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Size label -->
  <text x="60" y="68" font-family="sans-serif" font-size="8" fill="#f5c211" text-anchor="middle" opacity="0.7">36px</text>
</svg>
