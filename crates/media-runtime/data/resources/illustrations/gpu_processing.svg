<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <!-- GPU Processing: chip with processing elements -->
  <rect x="35" y="20" width="50" height="40" rx="4" fill="#3584e4" opacity="0.12" stroke="#3584e4" stroke-width="1.5"/>
  <!-- Inner core -->
  <rect x="48" y="30" width="24" height="20" rx="2" fill="#3584e4" opacity="0.25"/>
  <!-- Pin lines left -->
  <line x1="28" y1="30" x2="35" y2="30" stroke="#3584e4" stroke-width="1.5"/>
  <line x1="28" y1="40" x2="35" y2="40" stroke="#3584e4" stroke-width="1.5"/>
  <line x1="28" y1="50" x2="35" y2="50" stroke="#3584e4" stroke-width="1.5"/>
  <!-- Pin lines right -->
  <line x1="85" y1="30" x2="92" y2="30" stroke="#3584e4" stroke-width="1.5"/>
  <line x1="85" y1="40" x2="92" y2="40" stroke="#3584e4" stroke-width="1.5"/>
  <line x1="85" y1="50" x2="92" y2="50" stroke="#3584e4" stroke-width="1.5"/>
  <!-- Pin lines top -->
  <line x1="48" y1="14" x2="48" y2="20" stroke="#3584e4" stroke-width="1.5"/>
  <line x1="60" y1="14" x2="60" y2="20" stroke="#3584e4" stroke-width="1.5"/>
  <line x1="72" y1="14" x2="72" y2="20" stroke="#3584e4" stroke-width="1.5"/>
  <!-- Pin lines bottom -->
  <line x1="48" y1="60" x2="48" y2="66" stroke="#3584e4" stroke-width="1.5"/>
  <line x1="60" y1="60" x2="60" y2="66" stroke="#3584e4" stroke-width="1.5"/>
  <line x1="72" y1="60" x2="72" y2="66" stroke="#3584e4" stroke-width="1.5"/>
  <!-- Lightning bolt = acceleration -->
  <polygon points="58,32 63,32 61,38 65,38 57,48 59,42 55,42" fill="#f5c211"/>
</svg>
