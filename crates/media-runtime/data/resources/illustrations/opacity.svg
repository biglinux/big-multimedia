<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <!-- Transparency/opacity: stacked layers with decreasing opacity -->
  <rect x="20" y="10" width="40" height="30" rx="4" fill="#3584e4" opacity="1.0"/>
  <rect x="35" y="22" width="40" height="30" rx="4" fill="#3584e4" opacity="0.6"/>
  <rect x="50" y="34" width="40" height="30" rx="4" fill="#3584e4" opacity="0.3"/>
  <!-- Checkerboard pattern behind to show transparency -->
  <defs>
    <pattern id="checker" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#f5c211" opacity="0.15"/>
      <rect x="4" y="4" width="4" height="4" fill="#f5c211" opacity="0.15"/>
    </pattern>
  </defs>
  <rect x="50" y="34" width="40" height="30" rx="4" fill="url(#checker)"/>
  <!-- Slider indicator -->
  <line x1="22" y1="72" x2="98" y2="72" stroke="#3584e4" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <line x1="22" y1="72" x2="65" y2="72" stroke="#3584e4" stroke-width="2" stroke-linecap="round"/>
  <circle cx="65" cy="72" r="3" fill="#3584e4"/>
</svg>
