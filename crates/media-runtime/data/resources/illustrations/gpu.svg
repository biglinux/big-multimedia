<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <!-- GPU chip body -->
  <rect x="30" y="20" width="60" height="40" rx="4" fill="#3584e4" opacity="0.1" stroke="#3584e4" stroke-width="2"/>
  <!-- Chip label -->
  <text x="60" y="44" font-family="monospace" font-size="10" fill="#3584e4" text-anchor="middle">GPU</text>
  <!-- Pins left -->
  <line x1="22" y1="28" x2="30" y2="28" stroke="#3584e4" stroke-width="2"/>
  <line x1="22" y1="36" x2="30" y2="36" stroke="#3584e4" stroke-width="2"/>
  <line x1="22" y1="44" x2="30" y2="44" stroke="#3584e4" stroke-width="2"/>
  <line x1="22" y1="52" x2="30" y2="52" stroke="#3584e4" stroke-width="2"/>
  <!-- Pins right -->
  <line x1="90" y1="28" x2="98" y2="28" stroke="#3584e4" stroke-width="2"/>
  <line x1="90" y1="36" x2="98" y2="36" stroke="#3584e4" stroke-width="2"/>
  <line x1="90" y1="44" x2="98" y2="44" stroke="#3584e4" stroke-width="2"/>
  <line x1="90" y1="52" x2="98" y2="52" stroke="#3584e4" stroke-width="2"/>
  <!-- Pins top -->
  <line x1="42" y1="12" x2="42" y2="20" stroke="#3584e4" stroke-width="2"/>
  <line x1="52" y1="12" x2="52" y2="20" stroke="#3584e4" stroke-width="2"/>
  <line x1="62" y1="12" x2="62" y2="20" stroke="#3584e4" stroke-width="2"/>
  <line x1="72" y1="12" x2="72" y2="20" stroke="#3584e4" stroke-width="2"/>
  <!-- Pins bottom -->
  <line x1="42" y1="60" x2="42" y2="68" stroke="#3584e4" stroke-width="2"/>
  <line x1="52" y1="60" x2="52" y2="68" stroke="#3584e4" stroke-width="2"/>
  <line x1="62" y1="60" x2="62" y2="68" stroke="#3584e4" stroke-width="2"/>
  <line x1="72" y1="60" x2="72" y2="68" stroke="#3584e4" stroke-width="2"/>
</svg>
