<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <!-- Zoom: magnifying glass over a small frame -->
  <!-- Small image frame -->
  <rect x="22" y="20" width="40" height="30" rx="3" fill="#3584e4" opacity="0.15" stroke="#3584e4" stroke-width="1.5"/>
  <rect x="28" y="26" width="12" height="8" rx="1" fill="#3584e4" opacity="0.25"/>
  <!-- Magnifying glass -->
  <circle cx="72" cy="36" r="18" fill="none" stroke="#3584e4" stroke-width="2.5"/>
  <!-- Zoomed content inside lens -->
  <circle cx="72" cy="36" r="16" fill="#3584e4" opacity="0.08"/>
  <rect x="64" y="30" width="16" height="10" rx="1" fill="#3584e4" opacity="0.3"/>
  <!-- Handle -->
  <line x1="85" y1="49" x2="95" y2="59" stroke="#3584e4" stroke-width="3" stroke-linecap="round"/>
  <!-- Plus sign inside lens -->
  <line x1="72" y1="28" x2="72" y2="44" stroke="#f5c211" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="64" y1="36" x2="80" y2="36" stroke="#f5c211" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
