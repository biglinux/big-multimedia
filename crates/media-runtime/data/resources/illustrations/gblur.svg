<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <!-- Gaussian Blur: smooth blur effect -->
  <rect x="20" y="12" width="80" height="56" rx="5" fill="#3584e4" opacity="0.04" stroke="#3584e4" stroke-width="1"/>
  <!-- Gaussian bell curve -->
  <path d="M30,60 C40,60 42,58 48,40 C52,28 55,20 60,18 C65,20 68,28 72,40 C78,58 80,60 90,60" fill="#3584e4" opacity="0.1" stroke="#3584e4" stroke-width="2"/>
  <!-- Blur circles spreading outward -->
  <circle cx="60" cy="42" r="5" fill="#3584e4" opacity="0.3"/>
  <circle cx="60" cy="42" r="12" fill="none" stroke="#3584e4" stroke-width="1" opacity="0.2"/>
  <circle cx="60" cy="42" r="20" fill="none" stroke="#3584e4" stroke-width="0.8" opacity="0.12"/>
  <circle cx="60" cy="42" r="28" fill="none" stroke="#3584e4" stroke-width="0.5" opacity="0.06"/>
  <!-- Sigma label -->
  <text x="60" y="72" font-size="9" text-anchor="middle" fill="#f5c211" font-family="serif" font-style="italic">σ</text>
</svg>
