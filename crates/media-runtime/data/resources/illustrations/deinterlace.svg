<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <!-- Deinterlace: interlaced → progressive -->
  <g transform="translate(5,10)">
    <line x1="5" y1="10" x2="45" y2="10" stroke="#bbb" stroke-width="2"/>
    <line x1="5" y1="20" x2="45" y2="20" stroke="#bbb" stroke-width="2"/>
    <line x1="5" y1="30" x2="45" y2="30" stroke="#bbb" stroke-width="2"/>
    <line x1="5" y1="40" x2="45" y2="40" stroke="#bbb" stroke-width="2"/>
    <line x1="5" y1="50" x2="45" y2="50" stroke="#bbb" stroke-width="2"/>
    <text x="25" y="68" font-family="sans-serif" font-size="7" fill="#999" text-anchor="middle">interlaced</text>
  </g>
  <path d="M56,40 L66,40" stroke="#3584e4" stroke-width="2" fill="none" marker-end="url(#darr)"/>
  <defs><marker id="darr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3584e4"/></marker></defs>
  <g transform="translate(70,10)">
    <rect x="5" y="5" width="40" height="50" rx="3" fill="#3584e4" opacity="0.12"/>
    <rect x="5" y="5" width="40" height="50" rx="3" fill="none" stroke="#3584e4" stroke-width="1.5"/>
    <text x="25" y="68" font-family="sans-serif" font-size="7" fill="#3584e4" text-anchor="middle">progressive</text>
  </g>
</svg>
