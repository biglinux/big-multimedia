<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <!-- Window buttons: minimize, maximize, close with sizing arrows -->
  <!-- Button group background -->
  <rect x="20" y="20" width="80" height="26" rx="6" fill="#3584e4" opacity="0.08"/>
  <!-- Close button -->
  <circle cx="40" cy="33" r="9" fill="#e01b24" opacity="0.6"/>
  <line x1="36" y1="29" x2="44" y2="37" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="29" x2="36" y2="37" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Maximize button -->
  <circle cx="62" cy="33" r="9" fill="#33d17a" opacity="0.6"/>
  <rect x="57" y="28" width="10" height="10" rx="1" fill="none" stroke="white" stroke-width="1.5"/>
  <!-- Minimize button -->
  <circle cx="84" cy="33" r="9" fill="#f5c211" opacity="0.6"/>
  <line x1="79" y1="33" x2="89" y2="33" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Sizing arrows below -->
  <line x1="31" y1="56" x2="49" y2="56" stroke="#f5c211" stroke-width="1.2"/>
  <polyline points="33,53 31,56 33,59" fill="none" stroke="#f5c211" stroke-width="1.2" stroke-linecap="round"/>
  <polyline points="47,53 49,56 47,59" fill="none" stroke="#f5c211" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="53" y1="56" x2="71" y2="56" stroke="#f5c211" stroke-width="1.2"/>
  <polyline points="55,53 53,56 55,59" fill="none" stroke="#f5c211" stroke-width="1.2" stroke-linecap="round"/>
  <polyline points="69,53 71,56 69,59" fill="none" stroke="#f5c211" stroke-width="1.2" stroke-linecap="round"/>
</svg>
