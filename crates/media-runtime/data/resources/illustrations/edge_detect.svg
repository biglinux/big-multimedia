<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <!-- Edge detect: outlines of shapes -->
  <rect x="15" y="12" width="90" height="56" rx="5" fill="#3584e4" opacity="0.04"/>
  <!-- Edge lines forming a house shape -->
  <polyline points="40,55 40,35 60,22 80,35 80,55 40,55" fill="none" stroke="#3584e4" stroke-width="2"/>
  <!-- Door -->
  <rect x="54" y="42" width="12" height="13" fill="none" stroke="#f5c211" stroke-width="1.5"/>
  <!-- Window -->
  <rect x="44" y="36" width="8" height="8" fill="none" stroke="#f5c211" stroke-width="1.5"/>
  <!-- Ground line -->
  <line x1="30" y1="55" x2="90" y2="55" stroke="#3584e4" stroke-width="1" opacity="0.4"/>
  <!-- Glow on detected edges -->
  <polyline points="40,55 40,35 60,22 80,35 80,55" fill="none" stroke="#3584e4" stroke-width="4" opacity="0.12"/>
</svg>
