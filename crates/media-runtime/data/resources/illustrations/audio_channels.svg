<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <!-- Surround speaker layout (top view) -->
  <!-- Center circle (listener) -->
  <circle cx="60" cy="40" r="6" fill="#3584e4" opacity="0.2" stroke="#3584e4" stroke-width="1.5"/>
  <!-- Front Left -->
  <rect x="28" y="12" width="10" height="14" rx="2" fill="#3584e4" opacity="0.7"/>
  <text x="33" y="32" font-family="sans-serif" font-size="5" fill="#3584e4" text-anchor="middle">FL</text>
  <!-- Front Right -->
  <rect x="82" y="12" width="10" height="14" rx="2" fill="#3584e4" opacity="0.7"/>
  <text x="87" y="32" font-family="sans-serif" font-size="5" fill="#3584e4" text-anchor="middle">FR</text>
  <!-- Center -->
  <rect x="55" y="8" width="10" height="10" rx="2" fill="#f5c211" opacity="0.7"/>
  <text x="60" y="24" font-family="sans-serif" font-size="5" fill="#f5c211" text-anchor="middle">C</text>
  <!-- Rear Left -->
  <rect x="22" y="52" width="10" height="14" rx="2" fill="#3584e4" opacity="0.4"/>
  <text x="27" y="72" font-family="sans-serif" font-size="5" fill="#3584e4" text-anchor="middle">RL</text>
  <!-- Rear Right -->
  <rect x="88" y="52" width="10" height="14" rx="2" fill="#3584e4" opacity="0.4"/>
  <text x="93" y="72" font-family="sans-serif" font-size="5" fill="#3584e4" text-anchor="middle">RR</text>
  <!-- Sub -->
  <rect x="55" y="60" width="10" height="10" rx="2" fill="#f5c211" opacity="0.4"/>
  <text x="60" y="76" font-family="sans-serif" font-size="5" fill="#f5c211" text-anchor="middle">SW</text>
  <!-- Connection lines -->
  <line x1="33" y1="26" x2="55" y2="36" stroke="#3584e4" stroke-width="0.5" opacity="0.3"/>
  <line x1="87" y1="26" x2="65" y2="36" stroke="#3584e4" stroke-width="0.5" opacity="0.3"/>
  <line x1="60" y1="18" x2="60" y2="34" stroke="#f5c211" stroke-width="0.5" opacity="0.3"/>
  <line x1="27" y1="52" x2="55" y2="44" stroke="#3584e4" stroke-width="0.5" opacity="0.3"/>
  <line x1="93" y1="52" x2="65" y2="44" stroke="#3584e4" stroke-width="0.5" opacity="0.3"/>
</svg>
