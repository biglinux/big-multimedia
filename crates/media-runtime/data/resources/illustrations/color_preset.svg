  <circle cx="50" cy="22" r="8" fill="#f5c211"/>
  <circle cx="70" cy="22" r="8" fill="#33d17a"/>
  <circle cx="90" cy="30" r="8" fill="#3584e4"/>
  <circle cx="50" cy="52" r="8" fill="#c061cb"/>
  <circle cx="70" cy="52" r="8" fill="#ff7800"/>
  <!-- Thumb hole -->
  <ellipse cx="36" cy="52" rx="6" ry="8" fill="none" stroke="#3584e4" stroke-width="1.5" opacity="0.3"/>
</svg>
