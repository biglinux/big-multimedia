<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <!-- Frame 1 -->
  <rect x="8" y="20" width="22" height="16" rx="2" fill="none" stroke="#999" stroke-width="1.5"/>
  <circle cx="19" cy="28" r="3" fill="#999" opacity="0.6"/>
  <!-- Interpolated ghost frame -->
  <rect x="38" y="20" width="22" height="16" rx="2" fill="none" stroke="#3584e4" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="49" cy="28" r="3" fill="#3584e4" opacity="0.35"/>
  <!-- Frame 2 -->
  <rect x="68" y="20" width="22" height="16" rx="2" fill="none" stroke="#999" stroke-width="1.5"/>
  <circle cx="79" cy="28" r="3" fill="#999" opacity="0.6"/>
  <!-- Smooth motion arrow -->
  <path d="M15,48 C35,42 55,42 75,48" fill="none" stroke="#3584e4" stroke-width="2"/>
  <path d="M72,46 L78,48 L72,50" fill="#3584e4"/>
  <!-- Label -->
  <text x="60" y="66" font-family="sans-serif" font-size="7" fill="#3584e4" text-anchor="middle">smooth motion</text>
</svg>
