<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <!-- Subtitle scaling with window -->
  <!-- Small window with small text -->
  <rect x="8" y="20" width="30" height="22" rx="2" fill="none" stroke="#999" stroke-width="1.2"/>
  <rect x="10" y="22" width="26" height="18" rx="1" fill="#999" opacity="0.05"/>
  <text x="23" y="36" font-family="sans-serif" font-size="5" fill="#999" text-anchor="middle">Abc</text>
  <!-- Arrow -->
  <path d="M44,32 L54,32" stroke="#3584e4" stroke-width="2" fill="none" marker-end="url(#sarr)"/>
  <defs><marker id="sarr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3584e4"/></marker></defs>
  <!-- Large window with larger text -->
  <rect x="60" y="10" width="50" height="40" rx="3" fill="none" stroke="#3584e4" stroke-width="1.5"/>
  <rect x="63" y="13" width="44" height="34" rx="1" fill="#3584e4" opacity="0.05"/>
  <text x="85" y="40" font-family="sans-serif" font-size="9" fill="#3584e4" text-anchor="middle">Abc</text>
  <!-- Scale label -->
  <text x="60" y="66" font-family="sans-serif" font-size="7" fill="#3584e4" text-anchor="middle">proportional</text>
</svg>
