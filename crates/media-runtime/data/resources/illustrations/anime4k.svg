<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <!-- Anime4K: stylized anime face outline with upscale arrow -->
  <!-- Large round eye (anime style) -->
  <ellipse cx="45" cy="38" rx="12" ry="14" fill="none" stroke="#3584e4" stroke-width="2"/>
  <ellipse cx="45" cy="36" rx="6" ry="7" fill="#3584e4" opacity="0.7"/>
  <circle cx="42" cy="33" r="2.5" fill="#fff"/>
  <!-- Hair strands -->
  <path d="M28 20 Q35 8 50 12 Q58 14 62 22" fill="none" stroke="#3584e4" stroke-width="2" stroke-linecap="round"/>
  <path d="M30 24 Q36 16 44 18" fill="none" stroke="#3584e4" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Face outline -->
  <path d="M30 30 Q28 45 38 56 Q45 62 52 56 Q62 45 60 30" fill="none" stroke="#3584e4" stroke-width="2" stroke-linecap="round"/>
  <!-- Small mouth -->
  <path d="M42 50 Q45 52 48 50" fill="none" stroke="#3584e4" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 4K upscale badge -->
  <rect x="72" y="28" width="34" height="24" rx="4" fill="#f5c211" opacity="0.9"/>
  <text x="89" y="45" font-family="sans-serif" font-weight="bold" font-size="13" fill="#fff" text-anchor="middle">4K</text>
  <!-- Upscale arrow -->
  <path d="M89 22 L89 28" stroke="#f5c211" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M84 26 L89 19 L94 26" fill="none" stroke="#f5c211" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
