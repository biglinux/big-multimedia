<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <!-- Denoise: noisy signal → clean signal -->
  <rect x="8" y="18" width="48" height="44" rx="5" fill="#3584e4" opacity="0.10" stroke="#3584e4" stroke-width="1.2"/>
  <!-- Noisy zigzag -->
  <polyline points="14,42 18,30 22,48 26,35 30,50 34,28 38,45 42,32 46,47 50,38" fill="none" stroke="#3584e4" stroke-width="1.5" opacity="0.4"/>
  <!-- Noise dots -->
  <circle cx="20" cy="26" r="1.5" fill="#3584e4" opacity="0.3"/>
  <circle cx="34" cy="52" r="1.2" fill="#3584e4" opacity="0.3"/>
  <circle cx="44" cy="24" r="1" fill="#3584e4" opacity="0.3"/>
  <circle cx="16" cy="54" r="1.3" fill="#3584e4" opacity="0.3"/>
  <!-- Arrow -->
  <path d="M60,40 L68,40" stroke="#3584e4" stroke-width="1.5" fill="none"/>
  <polygon points="68,36 76,40 68,44" fill="#3584e4" opacity="0.6"/>
  <!-- Clean result -->
  <rect x="80" y="18" width="32" height="44" rx="5" fill="#3584e4" opacity="0.10" stroke="#3584e4" stroke-width="1.2"/>
  <path d="M86,42 Q92,28 98,42 Q104,56 106,42" fill="none" stroke="#3584e4" stroke-width="2"/>
</svg>
