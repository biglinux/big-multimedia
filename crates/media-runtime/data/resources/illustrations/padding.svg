<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <!-- Padding: inner space between border and content -->
  <!-- Container box -->
  <rect x="16" y="10" width="88" height="60" rx="6" fill="none" stroke="#3584e4" stroke-width="1.5"/>
  <!-- Content area (smaller, centered) -->
  <rect x="32" y="24" width="56" height="32" rx="3" fill="#3584e4" opacity="0.15"/>
  <!-- Content text lines -->
  <rect x="38" y="32" width="30" height="3" rx="1.5" fill="#3584e4" opacity="0.4"/>
  <rect x="38" y="39" width="40" height="3" rx="1.5" fill="#3584e4" opacity="0.3"/>
  <rect x="38" y="46" width="24" height="3" rx="1.5" fill="#3584e4" opacity="0.2"/>
  <!-- Padding indicators -->
  <!-- Top padding -->
  <line x1="60" y1="10" x2="60" y2="24" stroke="#f5c211" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Bottom padding -->
  <line x1="60" y1="56" x2="60" y2="70" stroke="#f5c211" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Left padding -->
  <line x1="16" y1="40" x2="32" y2="40" stroke="#f5c211" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Right padding -->
  <line x1="88" y1="40" x2="104" y2="40" stroke="#f5c211" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Labels -->
  <text x="60" y="19" font-family="sans-serif" font-size="6" fill="#f5c211" text-anchor="middle">pad</text>
  <text x="24" y="42" font-family="sans-serif" font-size="6" fill="#f5c211" text-anchor="middle">pad</text>
</svg>
