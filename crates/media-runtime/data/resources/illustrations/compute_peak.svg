<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <!-- Scene analysis: multiple brightness bars -->
  <g transform="translate(10,12)">
    <!-- Dark scene bar -->
    <rect x="0" y="0" width="40" height="10" rx="2" fill="#999" opacity="0.3"/>
    <rect x="0" y="0" width="12" height="10" rx="2" fill="#f5c211" opacity="0.4"/>
    <text x="44" y="8" font-family="sans-serif" font-size="6" fill="#999">dark</text>
    <!-- Medium scene bar -->
    <rect x="0" y="16" width="40" height="10" rx="2" fill="#999" opacity="0.3"/>
    <rect x="0" y="16" width="26" height="10" rx="2" fill="#f5c211" opacity="0.6"/>
    <text x="44" y="24" font-family="sans-serif" font-size="6" fill="#999">mid</text>
    <!-- Bright scene bar -->
    <rect x="0" y="32" width="40" height="10" rx="2" fill="#999" opacity="0.3"/>
    <rect x="0" y="32" width="38" height="10" rx="2" fill="#f5c211" opacity="0.8"/>
    <text x="44" y="40" font-family="sans-serif" font-size="6" fill="#999">bright</text>
  </g>
  <!-- Eye analyzing -->
  <g transform="translate(74,22)">
    <ellipse cx="16" cy="16" rx="16" ry="10" fill="none" stroke="#3584e4" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="6" fill="#3584e4" opacity="0.2"/>
    <circle cx="16" cy="16" r="3" fill="#3584e4"/>
  </g>
  <!-- Auto label -->
  <text x="90" y="58" font-family="sans-serif" font-size="7" fill="#3584e4" text-anchor="middle">auto-peak</text>
</svg>
