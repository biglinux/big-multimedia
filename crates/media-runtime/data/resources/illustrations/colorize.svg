<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <!-- Colorize: apply color tint overlay -->
  <rect x="25" y="16" width="70" height="48" rx="5" fill="#3584e4" opacity="0.06" stroke="#3584e4" stroke-width="1"/>
  <!-- Base image placeholder -->
  <rect x="32" y="22" width="56" height="36" rx="3" fill="#3584e4" opacity="0.08"/>
  <!-- Color overlay circles (blending) -->
  <circle cx="50" cy="38" r="14" fill="#3584e4" opacity="0.2"/>
  <circle cx="70" cy="38" r="14" fill="#f5c211" opacity="0.2"/>
  <!-- Overlap = colorized effect -->
  <ellipse cx="60" cy="38" rx="6" ry="12" fill="#3584e4" opacity="0.15"/>
  <!-- Paint brush -->
  <line x1="90" y1="14" x2="78" y2="30" stroke="#f5c211" stroke-width="2" stroke-linecap="round"/>
  <circle cx="78" cy="30" r="3" fill="#f5c211" opacity="0.5"/>
</svg>
