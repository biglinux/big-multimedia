<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <!-- Two subtitle lines stacked -->
  <!-- Primary subtitle bar -->
  <rect x="20" y="22" width="80" height="14" rx="3" fill="#3584e4" opacity="0.15"/>
  <text x="60" y="32" font-family="sans-serif" font-size="8" fill="#3584e4" text-anchor="middle">Primary subtitle</text>
  <!-- Secondary subtitle bar -->
  <rect x="20" y="44" width="80" height="14" rx="3" fill="#f5c211" opacity="0.15"/>
  <text x="60" y="54" font-family="sans-serif" font-size="8" fill="#f5c211" text-anchor="middle">Secondary subtitle</text>
  <!-- Label badges -->
  <text x="108" y="32" font-family="sans-serif" font-size="6" fill="#3584e4">1</text>
  <text x="108" y="54" font-family="sans-serif" font-size="6" fill="#f5c211">2</text>
</svg>
