<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <!-- Terminal window -->
  <rect x="20" y="10" width="80" height="56" rx="4" fill="none" stroke="#3584e4" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="20" y="10" width="80" height="12" rx="4" fill="#3584e4" opacity="0.15"/>
  <rect x="20" y="18" width="80" height="4" fill="#3584e4" opacity="0.15"/>
  <!-- Title bar dots -->
  <circle cx="30" cy="16" r="2" fill="#e01b24" opacity="0.7"/>
  <circle cx="38" cy="16" r="2" fill="#f5c211" opacity="0.7"/>
  <circle cx="46" cy="16" r="2" fill="#26a269" opacity="0.7"/>
  <!-- Terminal content -->
  <text x="28" y="36" font-family="monospace" font-size="7" fill="#26a269">$</text>
  <text x="36" y="36" font-family="monospace" font-size="7" fill="#3584e4">mpv --option</text>
  <!-- Cursor blinking -->
  <rect x="28" y="42" width="5" height="8" fill="#3584e4" opacity="0.6"/>
</svg>
