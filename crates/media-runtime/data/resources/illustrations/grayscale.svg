<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <!-- Grayscale: desaturated image -->
  <rect x="20" y="14" width="80" height="52" rx="5" fill="#3584e4" opacity="0.04" stroke="#3584e4" stroke-width="1.2"/>
  <!-- Landscape in grayscale tones -->
  <!-- Sky -->
  <rect x="24" y="18" width="72" height="20" fill="#3584e4" opacity="0.06"/>
  <!-- Sun -->
  <circle cx="80" cy="28" r="8" fill="#3584e4" opacity="0.12"/>
  <!-- Mountains -->
  <polygon points="24,45 44,25 64,45" fill="#3584e4" opacity="0.18"/>
  <polygon points="50,45 72,28 92,45" fill="#3584e4" opacity="0.25"/>
  <!-- Ground -->
  <rect x="24" y="45" width="72" height="17" rx="2" fill="#3584e4" opacity="0.1"/>
  <!-- Crossed-out color wheel -->
  <circle cx="60" cy="68" r="5" fill="none" stroke="#3584e4" stroke-width="1" opacity="0.4"/>
  <line x1="56" y1="72" x2="64" y2="64" stroke="#3584e4" stroke-width="1" opacity="0.4"/>
</svg>
