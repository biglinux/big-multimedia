<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <!-- Taskbar (bottom bar) -->
  <rect x="10" y="54" width="100" height="16" rx="4" fill="none" stroke="#999" stroke-width="1.5"/>
  <!-- App icons in taskbar -->
  <rect x="18" y="58" width="8" height="8" rx="2" fill="#999" opacity="0.4"/>
  <rect x="30" y="58" width="8" height="8" rx="2" fill="#3584e4"/>
  <rect x="42" y="58" width="8" height="8" rx="2" fill="#999" opacity="0.4"/>
  <!-- Progress overlay on active icon -->
  <rect x="30" y="67" width="8" height="2" rx="1" fill="#e5a50a"/>
  <!-- Music note above (indicating audio app) -->
  <circle cx="60" cy="28" r="18" fill="none" stroke="#3584e4" stroke-width="2"/>
  <path d="M 55,20 L 55,32 M 55,32 C 55,35 51,35 51,32 C 51,29 55,29 55,32" fill="none" stroke="#3584e4" stroke-width="2" stroke-linecap="round"/>
  <path d="M 64,18 L 64,30 M 64,30 C 64,33 60,33 60,30 C 60,27 64,27 64,30" fill="none" stroke="#3584e4" stroke-width="2" stroke-linecap="round"/>
  <!-- Arrow pointing from circle to taskbar -->
  <path d="M 60,46 L 34,54" fill="none" stroke="#e5a50a" stroke-width="1.5" stroke-dasharray="3,2"/>
</svg>
