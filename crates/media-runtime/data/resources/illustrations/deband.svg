<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <!-- Deband: gradient banding → smooth gradient -->
  <!-- Banded gradient left -->
  <rect x="8" y="20" width="44" height="40" rx="4" fill="none" stroke="#3584e4" stroke-width="1.2"/>
  <rect x="8" y="20" width="11" height="40" fill="#3584e4" opacity="0.35"/>
  <rect x="19" y="20" width="11" height="40" fill="#3584e4" opacity="0.25"/>
  <rect x="30" y="20" width="11" height="40" fill="#3584e4" opacity="0.15"/>
  <rect x="41" y="20" width="11" height="40" fill="#3584e4" opacity="0.05"/>
  <!-- Arrow -->
  <path d="M56,40 L64,40" stroke="#3584e4" stroke-width="1.5" fill="none"/>
  <polygon points="64,36 72,40 64,44" fill="#3584e4" opacity="0.6"/>
  <!-- Smooth gradient right -->
  <defs>
    <linearGradient id="smooth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3584e4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3584e4" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect x="76" y="20" width="36" height="40" rx="4" fill="url(#smooth)" stroke="#3584e4" stroke-width="1.2"/>
</svg>
