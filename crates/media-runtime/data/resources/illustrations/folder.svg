  <line x1="46" y1="40" x2="62" y2="40" stroke="#3584e4" stroke-width="1" opacity="0.3"/>
  <line x1="46" y1="44" x2="58" y2="44" stroke="#3584e4" stroke-width="1" opacity="0.3"/>
  <line x1="46" y1="48" x2="60" y2="48" stroke="#3584e4" stroke-width="1" opacity="0.3"/>
  <!-- Path dots -->
  <text x="58" y="72" font-family="monospace" font-size="6" fill="#3584e4" text-anchor="middle" opacity="0.6">/path/to/file</text>
</svg>
