  <circle cx="72" cy="40" r="4" fill="#c061cb" opacity="0.8"/>
  <!-- Neural connections -->
  <line x1="47" y1="28" x2="55" y2="32" stroke="#3584e4" stroke-width="0.8" opacity="0.4"/>
  <line x1="47" y1="28" x2="55" y2="48" stroke="#3584e4" stroke-width="0.8" opacity="0.3"/>
  <line x1="47" y1="40" x2="55" y2="32" stroke="#3584e4" stroke-width="0.8" opacity="0.4"/>
  <line x1="47" y1="40" x2="55" y2="48" stroke="#3584e4" stroke-width="0.8" opacity="0.4"/>
