<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <!-- Subtitle text with annotations being cleared -->
  <!-- Original text with SDH -->
  <text x="14" y="24" font-family="sans-serif" font-size="8" fill="#999">[music] Hello</text>
  <text x="14" y="36" font-family="sans-serif" font-size="8" fill="#999">[applause]</text>
  <!-- Strikethrough on SDH parts -->
  <line x1="12" y1="21" x2="45" y2="21" stroke="#e01b24" stroke-width="1.5"/>
  <line x1="12" y1="33" x2="60" y2="33" stroke="#e01b24" stroke-width="1.5"/>
  <!-- Arrow -->
  <path d="M68,30 L78,30" stroke="#3584e4" stroke-width="2" fill="none" marker-end="url(#farr)"/>
  <defs><marker id="farr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3584e4"/></marker></defs>
  <!-- Clean result -->
  <text x="84" y="30" font-family="sans-serif" font-size="9" fill="#3584e4">Hello</text>
  <!-- Bottom label -->
  <text x="60" y="62" font-family="sans-serif" font-size="7" fill="#3584e4" text-anchor="middle">clean subtitles</text>
</svg>
