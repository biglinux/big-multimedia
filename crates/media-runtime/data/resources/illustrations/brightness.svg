<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <!-- Sun with nits -->
  <circle cx="36" cy="36" r="12" fill="#f5c211" opacity="0.2"/>
  <circle cx="36" cy="36" r="8" fill="none" stroke="#f5c211" stroke-width="2"/>
  <!-- Rays -->
  <line x1="36" y1="18" x2="36" y2="22" stroke="#f5c211" stroke-width="1.5"/>
  <line x1="36" y1="50" x2="36" y2="54" stroke="#f5c211" stroke-width="1.5"/>
  <line x1="18" y1="36" x2="22" y2="36" stroke="#f5c211" stroke-width="1.5"/>
  <line x1="50" y1="36" x2="54" y2="36" stroke="#f5c211" stroke-width="1.5"/>
  <!-- Brightness meter -->
  <rect x="66" y="22" width="40" height="6" rx="3" fill="#ddd"/>
  <rect x="66" y="22" width="28" height="6" rx="3" fill="#3584e4"/>
  <!-- Contrast bar beneath -->
  <rect x="66" y="36" width="40" height="6" rx="3" fill="#ddd"/>
  <rect x="66" y="36" width="18" height="6" rx="3" fill="#3584e4" opacity="0.6"/>
  <!-- Labels -->
  <text x="86" y="18" font-family="sans-serif" font-size="7" fill="#3584e4" text-anchor="middle">peak</text>
  <text x="86" y="56" font-family="sans-serif" font-size="7" fill="#3584e4" text-anchor="middle" opacity="0.7">contrast</text>
</svg>
