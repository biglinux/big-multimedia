<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <!-- Motion Trail: fading trail effect -->
  <!-- Trail frames getting progressively more opaque -->
  <rect x="14" y="28" width="20" height="24" rx="3" fill="#3584e4" fill-opacity="0.06" stroke="#3584e4" stroke-width="0.8" stroke-opacity="0.15"/>
  <rect x="26" y="28" width="20" height="24" rx="3" fill="#3584e4" fill-opacity="0.10" stroke="#3584e4" stroke-width="0.8" stroke-opacity="0.2"/>
  <rect x="38" y="28" width="20" height="24" rx="3" fill="#3584e4" fill-opacity="0.15" stroke="#3584e4" stroke-width="0.8" stroke-opacity="0.3"/>
  <rect x="50" y="28" width="20" height="24" rx="3" fill="#3584e4" fill-opacity="0.22" stroke="#3584e4" stroke-width="0.8" stroke-opacity="0.4"/>
  <rect x="62" y="28" width="20" height="24" rx="3" fill="#3584e4" fill-opacity="0.30" stroke="#3584e4" stroke-width="1"/>
  <!-- Current frame (solid) -->
  <rect x="76" y="24" width="30" height="32" rx="4" fill="#3584e4" opacity="0.15" stroke="#3584e4" stroke-width="1.5"/>
  <!-- Moving object trail -->
  <circle cx="24" cy="40" r="4" fill="#f5c211" opacity="0.1"/>
  <circle cx="36" cy="40" r="4" fill="#f5c211" opacity="0.2"/>
  <circle cx="48" cy="40" r="4" fill="#f5c211" opacity="0.3"/>
  <circle cx="60" cy="40" r="4" fill="#f5c211" opacity="0.45"/>
  <circle cx="72" cy="40" r="4" fill="#f5c211" opacity="0.6"/>
  <circle cx="91" cy="40" r="5" fill="#f5c211" opacity="0.8"/>
</svg>
