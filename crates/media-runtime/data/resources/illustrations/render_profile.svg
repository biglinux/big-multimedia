<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <!-- Speed/quality gauge -->
  <path d="M 25,55 A 35,35 0 0 1 95,55" fill="none" stroke="#ddd" stroke-width="5" stroke-linecap="round"/>
  <!-- Colored arc: green=fast, yellow=balanced, blue=quality -->
  <path d="M 25,55 A 35,35 0 0 1 48,24" fill="none" stroke="#33d17a" stroke-width="5" stroke-linecap="round"/>
  <path d="M 48,24 A 35,35 0 0 1 72,24" fill="none" stroke="#e5a50a" stroke-width="5" stroke-linecap="round"/>
  <path d="M 72,24 A 35,35 0 0 1 95,55" fill="none" stroke="#3584e4" stroke-width="5" stroke-linecap="round"/>
  <!-- Needle pointing to balanced -->
  <line x1="60" y1="55" x2="60" y2="28" stroke="#3584e4" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="60" cy="55" r="4" fill="#3584e4"/>
  <!-- Labels -->
  <text x="22" y="70" font-family="sans-serif" font-size="8" fill="#999">Fast</text>
  <text x="85" y="70" font-family="sans-serif" font-size="8" fill="#999">HQ</text>
</svg>
