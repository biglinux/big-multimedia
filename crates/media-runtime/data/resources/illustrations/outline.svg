<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <!-- Letter "A" with visible outline layers -->
  <!-- Outer outline (shadow) -->
  <text x="60" y="52" font-family="sans-serif" font-weight="bold" font-size="38" fill="none" stroke="#999" stroke-width="5" text-anchor="middle" opacity="0.3">A</text>
  <!-- Middle outline (border) -->
  <text x="60" y="52" font-family="sans-serif" font-weight="bold" font-size="38" fill="none" stroke="#3584e4" stroke-width="3" text-anchor="middle" opacity="0.6"/>
  <!-- Inner text fill -->
  <text x="60" y="52" font-family="sans-serif" font-weight="bold" font-size="38" fill="white" text-anchor="middle"/>
  <!-- Annotation arrows showing layers -->
  <path d="M92,30 L82,36" stroke="#3584e4" stroke-width="1" fill="none" marker-end="url(#oarr)"/>
  <text x="94" y="28" font-family="sans-serif" font-size="6" fill="#3584e4">outline</text>
  <path d="M92,50 L84,46" stroke="#999" stroke-width="1" fill="none" marker-end="url(#oarr2)"/>
  <text x="94" y="48" font-family="sans-serif" font-size="6" fill="#999">shadow</text>
  <defs>
    <marker id="oarr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3584e4"/></marker>
    <marker id="oarr2" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#999"/></marker>
  </defs>
</svg>
