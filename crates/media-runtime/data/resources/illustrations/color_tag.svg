<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <!-- Color depth bars showing bit depth -->
  <!-- 8-bit bar (few steps) -->
  <g transform="translate(14,16)">
    <rect x="0" y="0" width="12" height="10" fill="#3584e4" opacity="0.2"/>
    <rect x="12" y="0" width="12" height="10" fill="#3584e4" opacity="0.4"/>
    <rect x="24" y="0" width="12" height="10" fill="#3584e4" opacity="0.6"/>
    <rect x="36" y="0" width="12" height="10" fill="#3584e4" opacity="0.8"/>
    <rect x="48" y="0" width="12" height="10" fill="#3584e4"/>
    <text x="30" y="24" font-family="sans-serif" font-size="6" fill="#999" text-anchor="middle">8-bit</text>
  </g>
  <!-- 16-bit bar (smooth gradient) -->
  <g transform="translate(14,42)">
    <defs>
      <linearGradient id="cgrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#3584e4" stop-opacity="0.1"/>
        <stop offset="100%" stop-color="#3584e4" stop-opacity="1"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="60" height="10" fill="url(#cgrad)"/>
    <text x="30" y="24" font-family="sans-serif" font-size="6" fill="#3584e4" text-anchor="middle">16-bit</text>
  </g>
  <!-- Color tag icon -->
  <g transform="translate(84,24)">
    <rect x="0" y="0" width="22" height="28" rx="3" fill="none" stroke="#f5c211" stroke-width="1.5"/>
    <circle cx="11" cy="10" r="4" fill="#f5c211" opacity="0.4"/>
    <line x1="4" y1="18" x2="18" y2="18" stroke="#f5c211" stroke-width="1" opacity="0.5"/>
    <line x1="4" y1="22" x2="14" y2="22" stroke="#f5c211" stroke-width="1" opacity="0.5"/>
  </g>
</svg>
