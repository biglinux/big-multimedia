# cargo-deny — policy: advisories (CVEs), licenses, bans, sources.
# Run: cargo deny check
#
# big-media-runtime links libmpv (Arch build = GPL-2.0-or-later + LGPL-2.1).
# Project license is GPL-3.0-or-later by technical necessity.

[graph]
all-features = false
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
version = 2
yanked = "warn"
ignore = [
    # paste v1.0.15 unmaintained (archived). Reached via lofty v0.24.
    # No safe upgrade; lofty has not released a paste-free version.
    { id = "RUSTSEC-2024-0436", reason = "transitive via lofty; no upstream fix" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "GPL-3.0-or-later",
    "LGPL-2.1",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
