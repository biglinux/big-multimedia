[package]
name = "big-app-kit-core"
version = "0.1.0"
publish = false  # consumed by big-app-kit via path dep, not crates.io
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Display-free (GTK-free) app-building contracts for BigLinux Rust desktop applications"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["desktop", "biglinux", "app", "contracts"]
categories = ["config"]

[dependencies]
serde_json.workspace = true
big-os-kit.workspace = true
# Remote-control logging is opt-in. The endpoint itself uses bounded std sockets.
log = { workspace = true, optional = true }

# The control server is opt-in. Default is empty.
[features]
default = []
remote-control = ["dep:log"]
