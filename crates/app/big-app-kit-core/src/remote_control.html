<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Big Media Player — Remote</title><link rel="stylesheet" href="remote.css"><script src="remote.js" defer></script></head>
<body><main><h1 id="heading">Remote control</h1><p id="connection" role="status" aria-live="polite">Connecting…</p>
<section id="media" class="card" aria-label="Media"><p id="title" class="title">—</p><p id="artist" class="artist"></p>
<progress id="progress" value="0" max="1" aria-label="Playback progress"></progress><div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div></section>
<div class="controls"><button id="prev" disabled>Previous</button><button id="pp" class="primary" disabled>Play</button><button id="next" disabled>Next</button></div>
<div class="card volume"><label id="volume-label" for="vol">Volume</label><output id="volume-value" for="vol">0%</output><input id="vol" type="range" min="0" max="100" value="0" disabled></div>
<footer><p>Big Media Player</p><p id="warning">Use only on a trusted local network. This HTTP connection is not encrypted.</p></footer></main></body></html>
