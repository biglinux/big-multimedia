[package]
name = "big-media-components"
version = "0.1.0"
publish = false  # consumed by sibling apps via path dep, not crates.io
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reusable media UI components for BigLinux Rust applications"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["gtk4", "media", "libadwaita", "components", "biglinux"]
categories = ["gui", "multimedia"]

[dependencies]
adw.workspace = true
gtk.workspace = true
relm4.workspace = true
serde_json.workspace = true
big-relm4-components.workspace = true
# Pure parsers (radio-browser, media file-type knowledge) re-exported by this
# crate live in the GTK-free engines leaf.
big-media-engines = { workspace = true, features = ["radio-browser"] }
