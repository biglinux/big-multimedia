[package]
name = "big-relm4-components"
version = "0.1.0"
publish = false  # consumed by sibling apps via path dep, not crates.io
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reusable Relm4/libadwaita components for BigLinux applications"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["relm4", "gtk4", "libadwaita", "components", "biglinux"]
categories = ["gui"]

[dependencies]
big-gtk-kit = { workspace = true }
adw.workspace = true
gtk.workspace = true
relm4.workspace = true
gettext-rs.workspace = true
big-app-kit.workspace = true
# Direct dep on the display-free core so the GTK-free `zone_layout` model is
# re-exported from `input::zone_layout` (the editor + runtime applier consume it
# without the widget graph living in core).
big-app-kit-core.workspace = true

[package.metadata.cargo-machete]
ignored = ["gettext-rs"]  # imported as gettextrs in src/i18n.rs
