[package]
name = "big-media-engines"
version = "0.1.0"
publish = false  # consumed by sibling apps via path dep, not crates.io (see ARCHITECTURE.md §8)
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Display-free media helpers (file types, play queue) for BigLinux apps"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["media", "queue", "biglinux"]
categories = ["multimedia", "parser-implementations"]

[dependencies]
# `serde_json` is only the Radio-Browser JSON feed parser's; gated so the crate
# stays near-zero-dep by default (subtitle/playlist/media_files use only std).
serde_json = { workspace = true, optional = true }
# `log` is NOT optional: the core `queue` module (always compiled) emits
# `log::debug!`/`warn!`. Gating it behind `radio-browser` left `queue` unable to
# find `log` under any feature subset that omits radio-browser (caught by
# `cargo hack --feature-powerset`). Workspace logging facade, single version.
log = { workspace = true }

[features]
# Radio-Browser API response parser (pulls serde_json).
radio-browser = ["dep:serde_json"]
