# SPDX-License-Identifier: MIT
[package]
name = "big-os-kit"
version = "0.1.0"
publish = false  # consumed by sibling apps via path dep, not crates.io
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GTK-free OS/persistence/secret contracts for BigLinux Rust apps (subprocess, atomic storage, keyring)"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["subprocess", "keyring", "storage", "biglinux"]
categories = ["os", "filesystem"]
# Names the metadata build.rs hands to dependents' build scripts; links no library.
links = "big_os_kit"

[dependencies]
bon.workspace = true
thiserror.workspace = true
log.workspace = true
libc.workspace = true
# Statically linked jemalloc behind the `jemalloc` feature (see src/allocator.rs).
tikv-jemalloc-sys = { workspace = true, optional = true }

[features]
default = []
# Link jemalloc in as the allocator of the whole process. Only executables
# enable it; they must also export the symbols (see src/allocator.rs).
jemalloc = ["dep:tikv-jemalloc-sys"]

[lints.rust]
# cargo-fuzz sets cfg(fuzzing) for the entry points the fuzz targets call.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
