# SPDX-License-Identifier: MIT
[package]
name = "big-os-kit"
version = "0.1.0"
publish = false  # consumed by sibling apps via path dep, not crates.io (see ARCHITECTURE.md §8)
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GTK-free OS/persistence/secret contracts for BigLinux Rust apps (subprocess, atomic storage, keyring)"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["subprocess", "keyring", "storage", "biglinux"]
categories = ["os", "filesystem"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
bon.workspace = true
thiserror.workspace = true
log.workspace = true
# Reuse the exact ring release already locked by the workspace for SHA-256 receipts.
ring = "0.17.14"
libc.workspace = true
# Statically linked jemalloc behind the `jemalloc` feature (see src/allocator.rs).
tikv-jemalloc-sys = { workspace = true, optional = true }

[features]
default = []
# Compatibility feature for consumers that explicitly opt into shared HTTP
# policy. The backend uses the system curl binary and adds no Rust HTTP/TLS dep.
http-client = []
# Link jemalloc in as the allocator of the whole process. Only executables
# enable it; they must also export the symbols (see src/allocator.rs).
jemalloc = ["dep:tikv-jemalloc-sys"]
