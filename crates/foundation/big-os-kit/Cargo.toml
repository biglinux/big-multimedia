# SPDX-License-Identifier: MIT
[package]
name = "big-os-kit"
version = "0.1.0"
publish = false  # consumed by sibling apps via path dep, not crates.io (see ARCHITECTURE.md §8)
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GTK-free OS/persistence/secret contracts for BigLinux Rust apps (subprocess, atomic storage, keyring)"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["subprocess", "keyring", "storage", "biglinux"]
categories = ["os", "filesystem"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
bon.workspace = true
thiserror.workspace = true
log.workspace = true
# glibc-only `malloc_trim` (mem::trim_arenas) — return freed arenas to the OS.
libc.workspace = true

[features]
default = []
# Compatibility feature for consumers that explicitly opt into shared HTTP
# policy. The backend uses the system curl binary and adds no Rust HTTP/TLS dep.
http-client = []
