app-id: br.com.biglinux.AudioPlayer
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: big-audio-player
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
modules:
  - name: big-audio-player
    buildsystem: simple
    build-commands:
      - cargo build --release --locked
      - install -Dm755 target/release/big-audio-player /app/bin/big-audio-player
      - install -Dm644 resources/applications/br.com.biglinux.AudioPlayer.desktop /app/share/applications/br.com.biglinux.AudioPlayer.desktop
      - install -Dm644 resources/metainfo/br.com.biglinux.AudioPlayer.metainfo.xml /app/share/metainfo/br.com.biglinux.AudioPlayer.metainfo.xml
      - install -Dm644 resources/icons/hicolor/scalable/apps/big-audio-player.svg /app/share/icons/hicolor/scalable/apps/big-audio-player.svg
    sources:
      - type: dir
        path: ../..
# Summary: Music and audio player for BigLinux
